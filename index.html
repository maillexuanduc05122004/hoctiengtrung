    <!--
      Thẻ xem trước khi gửi liên kết qua Zalo, Messenger hay Facebook. Các nơi đó

    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mỗi Ngày 中文" />

    <meta property="og:title" content="Mỗi Ngày 中文 — Học từ vựng HSK 1-3 | Lê Xuân Đức" />
    <meta
      property="og:description"
      content="Ứng dụng học từ vựng HSK 3.0 cấp 1 đến cấp 3 của Lê Xuân Đức: lật thẻ, gõ đáp án, nghe chép và luyện nói theo từng buổi khoảng 10 từ. Dùng được khi ngoại tuyến."
    />

    <meta name="twitter:title" content="Mỗi Ngày 中文 — Học từ vựng HSK 1-3 | Lê Xuân Đức" />
    <meta
      name="twitter:description"
      content="Ứng dụng học từ vựng HSK 3.0 cấp 1 đến cấp 3 của Lê Xuân Đức: lật thẻ, gõ đáp án, nghe chép và luyện nói theo từng buổi khoảng 10 từ. Dùng được khi ngoại tuyến."

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="theme-color" content="#f6f1e7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1b1916" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Đặt chủ đề trước khi React dựng cây để tránh nháy màu khi tải trang.
      (function () {
        try {
          var saved = localStorage.getItem('moingay.theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = saved === 'light' || saved === 'dark' ? saved : prefersDark ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (error) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Ứng dụng cần bật JavaScript để chạy.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
